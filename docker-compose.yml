services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DB_PATH: /data/app.db
    volumes:
      - ./data:/data
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    environment:
      API_TARGET: http://backend:8000
    ports: ["5173:5173"]
    depends_on: [backend]
